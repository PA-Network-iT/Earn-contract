[profile.default]
# Main source, test, script, and artifact directories.
src = "src"
test = "test"
script = "script"
out = "out"
libs = ["lib"]
# Match the audited compiler version and deterministic build settings.
solc_version = "0.8.30"
optimizer = true
optimizer_runs = 1
via_ir = true
bytecode_hash = "none"
cbor_metadata = false
ffi = false
# Tests can read project files but cannot write through cheatcode file permissions.
fs_permissions = [{ access = "read", path = "./" }]

[fuzz]
# Fuzzing budget used by unit and property tests.
runs = 256
max_test_rejects = 65536

[invariant]
# Invariant campaign depth and reporting behavior.
runs = 128
depth = 32
fail_on_revert = false
show_metrics = true
